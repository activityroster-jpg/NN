name: Make guide videos

# Renders the cruising guide videos (1920×1080, narration, intro sting,
# captions) and the shorts (1080×1920, stock footage, narration) from the
# live site and stores them in the R2 bucket, where Admin → Videos offers
# them for download. Runs after every successful "Deploy production" and only
# renders what changed. Run it by hand to re-render specific guides or shorts
# ("all" for every one).
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets as the
# deploy; the token needs Account → Workers R2 Storage → Edit to store videos.
# Each video is also attached to the run as a download.

on:
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]
  # Every six hours too: picks up guides whose narration has since finished
  # recording (for example after ElevenLabs credits were topped up).
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      guides:
        description: "Guide ids, comma separated; blank = only changed guides; all = every guide; none = skip guides"
        required: false
        default: ""
      shorts:
        description: "Short ids, comma separated; blank = only changed shorts; all = every short; none = skip shorts"
        required: false
        default: ""
      lessons:
        description: "Lesson slugs, comma separated; blank = only changed lessons; all = every lesson; none = skip lessons"
        required: false
        default: ""
      howtos:
        description: "Know-how guide ids, comma separated; blank = only changed videos; all = every one; none = skip them"
        required: false
        default: ""

concurrency:
  group: guide-videos
  cancel-in-progress: false

env:
  SITE: https://nauticalnomads.com
  BUCKET: nautical-nomads-photos

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shorts: ${{ steps.plan.outputs.shorts }}
      lessons: ${{ steps.plan.outputs.lessons }}
      howtos: ${{ steps.plan.outputs.howtos }}
    steps:
      - name: Which videos to make
        id: plan
        env:
          ONLY: ${{ github.event.inputs.guides }}
          ONLY_SHORTS: ${{ github.event.inputs.shorts }}
          ONLY_LESSONS: ${{ github.event.inputs.lessons }}
          ONLY_HOWTOS: ${{ github.event.inputs.howtos }}
        run: |
          curl -fsS "$SITE/api/cruising/videos" > guides.json
          curl -fsS "$SITE/api/shorts/videos" > shorts.json
          curl -fsS "$SITE/api/courses/videos" > lessons.json
          curl -fsS "$SITE/api/cruising/howto-videos" > howtos.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          def plan(items, only, why):
              only = [x.strip() for x in only.split(",") if x.strip()]
              ready = [g for g in items if g["ready"]]
              for g in items:
                  if not g["ready"]:
                      print(f"skipping {g['id']}: {why(g)}", file=sys.stderr)
              if only == ["none"]:
                  return []
              if only == ["all"]:
                  return ready
              if only:
                  return [g for g in ready if g["id"] in only]
              return [g for g in ready if not g["current"]]
          guides = plan(json.load(open("guides.json"))["guides"], os.environ.get("ONLY", ""), lambda g: f"narration {g['narration']} recorded")
          shorts = plan(json.load(open("shorts.json"))["shorts"], os.environ.get("ONLY_SHORTS", ""), lambda g: f"narration {g['narration']} recorded, footage {g['footage']} chosen")
          print("matrix=" + json.dumps([{"id": g["id"], "key": g["key"]} for g in guides]))
          print("shorts=" + json.dumps([{"id": g["id"], "key": g["key"]} for g in shorts]))
          lessons = plan(json.load(open("lessons.json"))["lessons"], os.environ.get("ONLY_LESSONS", ""), lambda g: f"narration {g['narration']} recorded")
          print("lessons=" + json.dumps([{"id": g["id"], "key": g["key"]} for g in lessons]))
          howtos = plan(json.load(open("howtos.json"))["howtos"], os.environ.get("ONLY_HOWTOS", ""), lambda g: f"narration {g['narration']} recorded")
          print("howtos=" + json.dumps([{"id": g["id"], "key": g["key"]} for g in howtos]))
          PY
          cat "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        guide: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render ${{ matrix.guide.id }}
        run: node scripts/videos/make-guide-video.mjs "$SITE" "${{ matrix.guide.id }}" "out/${{ matrix.guide.id }}.mp4"
      - name: Attach the video to this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.guide.id }}
          path: |
            out/${{ matrix.guide.id }}.mp4
            out/${{ matrix.guide.id }}.jpg
          retention-days: 14
      - name: Store for Admin → Videos
        run: |
          key="${{ matrix.guide.key }}"
          npx wrangler r2 object put "$BUCKET/${key%.mp4}.jpg" --file "out/${{ matrix.guide.id }}.jpg" --content-type image/jpeg --remote --jurisdiction eu \
          && npx wrangler r2 object put "$BUCKET/$key" --file "out/${{ matrix.guide.id }}.mp4" --content-type video/mp4 --remote --jurisdiction eu \
            || echo "::warning::Could not store the video in Cloudflare (does the API token have Workers R2 Storage → Edit?). It is attached to this run as a download."

  render-short:
    needs: plan
    if: needs.plan.outputs.shorts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        short: ${{ fromJSON(needs.plan.outputs.shorts) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render ${{ matrix.short.id }}
        run: node scripts/videos/make-short.mjs "$SITE" "${{ matrix.short.id }}" "out/${{ matrix.short.id }}.mp4"
      - name: Attach the video to this run
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.short.id }}
          path: |
            out/${{ matrix.short.id }}.mp4
            out/${{ matrix.short.id }}.jpg
          retention-days: 14
      - name: Store for Admin → Videos
        run: |
          key="${{ matrix.short.key }}"
          npx wrangler r2 object put "$BUCKET/${key%.mp4}.jpg" --file "out/${{ matrix.short.id }}.jpg" --content-type image/jpeg --remote --jurisdiction eu \
          && npx wrangler r2 object put "$BUCKET/$key" --file "out/${{ matrix.short.id }}.mp4" --content-type video/mp4 --remote --jurisdiction eu \
            || echo "::warning::Could not store the video in Cloudflare (does the API token have Workers R2 Storage → Edit?). It is attached to this run as a download."

  render-lesson:
    needs: plan
    if: needs.plan.outputs.lessons != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        lesson: ${{ fromJSON(needs.plan.outputs.lessons) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render ${{ matrix.lesson.id }}
        env:
          RENDER_PATH: /render/lesson
        run: node scripts/videos/make-guide-video.mjs "$SITE" "${{ matrix.lesson.id }}" "out/${{ matrix.lesson.id }}.mp4"
      - name: Attach the video to this run
        uses: actions/upload-artifact@v4
        with:
          name: lesson-${{ matrix.lesson.id }}
          path: |
            out/${{ matrix.lesson.id }}.mp4
            out/${{ matrix.lesson.id }}.jpg
          retention-days: 14
      - name: Store for Admin → Videos
        run: |
          key="${{ matrix.lesson.key }}"
          npx wrangler r2 object put "$BUCKET/${key%.mp4}.jpg" --file "out/${{ matrix.lesson.id }}.jpg" --content-type image/jpeg --remote --jurisdiction eu \
          && npx wrangler r2 object put "$BUCKET/${key%.mp4}.json" --file "out/${{ matrix.lesson.id }}.json" --content-type application/json --remote --jurisdiction eu \
          && npx wrangler r2 object put "$BUCKET/$key" --file "out/${{ matrix.lesson.id }}.mp4" --content-type video/mp4 --remote --jurisdiction eu \
            || echo "::warning::Could not store the video in Cloudflare (does the API token have Workers R2 Storage → Edit?). It is attached to this run as a download."

  render-howto:
    needs: plan
    if: needs.plan.outputs.howtos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        howto: ${{ fromJSON(needs.plan.outputs.howtos) }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Render ${{ matrix.howto.id }}
        env:
          RENDER_PATH: /render/howto
        run: node scripts/videos/make-guide-video.mjs "$SITE" "${{ matrix.howto.id }}" "out/${{ matrix.howto.id }}.mp4"
      - name: Attach the video to this run
        uses: actions/upload-artifact@v4
        with:
          name: howto-${{ matrix.howto.id }}
          path: |
            out/${{ matrix.howto.id }}.mp4
            out/${{ matrix.howto.id }}.jpg
          retention-days: 14
      - name: Store for Admin → Videos
        run: |
          key="${{ matrix.howto.key }}"
          npx wrangler r2 object put "$BUCKET/${key%.mp4}.jpg" --file "out/${{ matrix.howto.id }}.jpg" --content-type image/jpeg --remote --jurisdiction eu \
          && npx wrangler r2 object put "$BUCKET/${key%.mp4}.json" --file "out/${{ matrix.howto.id }}.json" --content-type application/json --remote --jurisdiction eu \
          && npx wrangler r2 object put "$BUCKET/$key" --file "out/${{ matrix.howto.id }}.mp4" --content-type video/mp4 --remote --jurisdiction eu \
            || echo "::warning::Could not store the video in Cloudflare (does the API token have Workers R2 Storage → Edit?). It is attached to this run as a download."
