name: Deploy production

# Production deploys only when someone presses "Run workflow" on this page.
# That click is the approval. What a deploy does, in order:
#   1. typecheck and tests
#   2. build the Worker
#   3. record the D1 Time Travel bookmark (restore point) in the run summary
#   4. apply pending database migrations
#   5. deploy the Worker
#   6. smoke test nauticalnomads.com; roll back to the previous version on failure
#   7. tag the commit prod-<date>
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (see docs/setup.md). Once this workflow is in use, Cloudflare's own
# "Workers Builds" must be disconnected: it deploys without running migrations.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy"
        required: true
        default: "main"

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      SITE: https://nauticalnomads.com
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set (Settings → Secrets and variables → Actions). See docs/setup.md."
            exit 1
          fi
          # The Cloudflare account that holds the nn Worker, the domain and the database.
          # Account IDs are not secret (they appear in every dashboard URL).
          EXPECTED="80cced925b3b62150385392a692fc17c"
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "$EXPECTED" ]; then
            echo "::error::The CLOUDFLARE_ACCOUNT_ID secret is not the Activityroster account's ID. Set it to $EXPECTED (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check the token can reach D1 in this account
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "Token status: $(api /user/tokens/verify | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(r.success?r.result.status:JSON.stringify(r.errors))})')"
          LIST="$(api /accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database)"
          OK="$(printf '%s' "$LIST" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(r.success?"yes":"no:"+JSON.stringify(r.errors))})')"
          if [ "$OK" != "yes" ]; then
            echo "::error::The API token cannot list D1 databases in this account ($OK). In Cloudflare → My Profile → API Tokens, edit the token and make sure it has Account → D1 → Edit for this account, then update the CLOUDFLARE_API_TOKEN secret if the token value changed."
            exit 1
          fi
          if ! printf '%s' "$LIST" | grep -q "$(grep -o '"database_id": *"[^"]*"' wrangler.jsonc | head -1 | sed 's/.*"\([^"]*\)"$/\1/')"; then
            echo "::error::The database id in wrangler.jsonc is not in this Cloudflare account. Create the D1 database in the Activityroster account (or check the id) and update wrangler.jsonc."
            exit 1
          fi
          BUCKETS="$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets?jurisdiction=eu")"
          if ! printf '%s' "$BUCKETS" | grep -q '"name": *"nautical-nomads-photos"'; then
            echo "::error::The R2 bucket nautical-nomads-photos was not found (or the token lacks Account → Workers R2 Storage → Edit). Cloudflare → R2 → Create bucket → nautical-nomads-photos, location Europe. See docs/setup.md 4b."
            exit 1
          fi
          echo "Cloudflare access OK: token valid, D1 reachable, database and photo bucket found."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check the database id is filled in
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder database_id. Create the D1 database and put its id in wrangler.jsonc (docs/setup.md, steps 1 and 2)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Record the Time Travel bookmark (restore point)
        run: |
          set -o pipefail
          echo "### Production deploy of $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "D1 Time Travel bookmark before this deploy (restore with 'wrangler d1 time-travel restore nautical-nomads --bookmark=…'):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 time-travel info nautical-nomads --json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pending migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Remember the current Worker version (for rollback)
        id: prev
        run: |
          PREV="$(npx wrangler versions list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s);console.log(l[0]?l[0].id:"")}catch{console.log("")}})')"
          echo "id=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous version: ${PREV:-none}"

      - name: Deploy
        run: npx wrangler deploy

      - name: Smoke test
        id: smoke
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$SITE/api/health" | grep -q '"ok":true' && curl -fsSL -o /dev/null "$SITE/en" && curl -fsSL -o /dev/null "$SITE/en/plan"; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            hdr="$(curl -sS -o /dev/null -D - "$SITE/api/health" || true)"
            if printf '%s' "$hdr" | grep -qi '^cf-mitigated: challenge'; then
              echo "::error::Cloudflare's Bot Fight Mode blocked the smoke test. Turn it off: Cloudflare → nauticalnomads.com → Security → Bots. The deploy has been rolled back."
            else
              echo "::error::Smoke test failed: /api/health, /en or /en/plan did not load. Rolling back."
            fi
            exit 1
          fi
          echo "production healthy"

      - name: Check a yacht page's images
        # Informational: lists every image on one model page and whether it loads.
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          page="$(curl -fsSL "$SITE/en/yachts/lagoon-46" || true)"
          printf '%s' "$page" | grep -oE '<img[^>]*src="[^"]*"' | grep -oE 'src="[^"]*"' | cut -d'"' -f2 | sort -u | while read -r src; do
            case "$src" in http*) url="$src" ;; *) url="$SITE$src" ;; esac
            printf '%s  %s\n' "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$url")" "$src"
          done

      - name: Copy optional keys from GitHub secrets to the Worker
        # Keys can live in GitHub (Settings → Secrets and variables → Actions)
        # or directly on the Worker in Cloudflare. Any set in GitHub are copied
        # to the Worker here, after the smoke test passed.
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          for name in ELEVENLABS_API_KEY PIXABAY_API_KEY; do
            val="${!name}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name" > /dev/null && echo "$name copied to the Worker"
            else
              echo "$name is not a GitHub secret (fine if it is set on the Worker in Cloudflare)"
            fi
          done

      - name: Record the guide narration and intro music
        # Recording uses ELEVENLABS_API_KEY on the Worker. Each call records for
        # about 25 seconds; repeat until nothing is left. Problems are reported
        # here but never fail the deploy (videos fall back to the device voice).
        run: |
          # Up to about an hour (a first run of new guides); stops as soon as
          # everything is recorded, or on an error, or if nothing progresses.
          stuck=0; last=""
          for i in $(seq 1 150); do
            r="$(curl -sS --max-time 90 -X POST "$SITE/api/narration/warm" || echo '{"error":"request failed"}')"
            echo "$r"
            if printf '%s' "$r" | grep -q '"remaining":0' && ! printf '%s' "$r" | grep -q '"error"'; then echo "All narration recorded."; exit 0; fi
            if printf '%s' "$r" | grep -q '"error"'; then echo "::warning::Narration not fully recorded: $r"; exit 0; fi
            rem="$(printf '%s' "$r" | sed -n 's/.*"remaining":\([0-9-]*\).*/\1/p')"
            if [ "$rem" = "$last" ]; then stuck=$((stuck+1)); else stuck=0; fi
            last="$rem"
            if [ "$stuck" -ge 3 ]; then echo "::warning::Narration stopped progressing ($r); the hourly job will retry."; exit 0; fi
          done
          echo "::warning::Narration still recording; the hourly job will finish it."

      - name: Choose stock footage for the shorts
        if: success()
        run: |
          # Picks and downloads a Pixabay clip for each short scene that lacks
          # one; stops as soon as everything is chosen, or on an error. A
          # "retry" answer means Pixabay asked us to slow down: wait and go on.
          stuck=0; last=""
          for i in $(seq 1 40); do
            r="$(curl -sS --max-time 90 -X POST "$SITE/api/shorts/footage/warm" || echo '{"error":"request failed"}')"
            echo "$r"
            if printf '%s' "$r" | grep -q '"remaining":0' && ! printf '%s' "$r" | grep -q '"error"'; then echo "All footage chosen."; exit 0; fi
            if printf '%s' "$r" | grep -q '"error"'; then echo "::warning::Footage not fully chosen: $r"; exit 0; fi
            rem="$(printf '%s' "$r" | sed -n 's/.*"remaining":\([0-9-]*\).*/\1/p')"
            if [ "$rem" = "$last" ]; then stuck=$((stuck+1)); else stuck=0; fi
            last="$rem"
            if [ "$stuck" -ge 8 ]; then echo "::warning::Footage stopped progressing ($r); the next deploy will retry."; exit 0; fi
            if printf '%s' "$r" | grep -q '"retry":true'; then sleep 20; fi
          done
          echo "::warning::Footage still downloading; the next deploy will finish it."

      - name: Roll back if the smoke test failed
        if: failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.id != ''
        run: |
          npx wrangler rollback "${{ steps.prev.outputs.id }}" --message "Automatic rollback - smoke test failed" || true

      - name: Tag the release
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="prod-$(date -u +%Y%m%d-%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
