name: Deploy production

# Production deploys only when someone presses "Run workflow" on this page.
# That click is the approval. What a deploy does, in order:
#   1. typecheck and tests
#   2. build the Worker
#   3. record the D1 Time Travel bookmark (restore point) in the run summary
#   4. apply pending database migrations
#   5. deploy the Worker
#   6. smoke test nauticalnomads.com; roll back to the previous version on failure
#   7. tag the commit prod-<date>
#
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# (see docs/setup.md). Once this workflow is in use, Cloudflare's own
# "Workers Builds" must be disconnected: it deploys without running migrations.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to deploy"
        required: true
        default: "main"

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      SITE: https://nauticalnomads.com
    steps:
      - name: Check deploy secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set (Settings → Secrets and variables → Actions). See docs/setup.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check the database id is filled in
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder database_id. Create the D1 database and put its id in wrangler.jsonc (docs/setup.md, steps 1 and 2)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Record the Time Travel bookmark (restore point)
        run: |
          set -o pipefail
          echo "### Production deploy of $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "D1 Time Travel bookmark before this deploy (restore with 'wrangler d1 time-travel restore nautical-nomads --bookmark=…'):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npx wrangler d1 time-travel info nautical-nomads --json | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pending migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Remember the current Worker version (for rollback)
        id: prev
        run: |
          PREV="$(npx wrangler versions list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const l=JSON.parse(s);console.log(l[0]?l[0].id:"")}catch{console.log("")}})')"
          echo "id=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous version: ${PREV:-none}"

      - name: Deploy
        run: npx wrangler deploy

      - name: Smoke test
        id: smoke
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$SITE/api/health" | grep -q '"ok":true' && curl -fsSL -o /dev/null "$SITE/en" && curl -fsSL -o /dev/null "$SITE/en/plan"; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            hdr="$(curl -sS -o /dev/null -D - "$SITE/api/health" || true)"
            if printf '%s' "$hdr" | grep -qi '^cf-mitigated: challenge'; then
              echo "::error::Cloudflare's Bot Fight Mode blocked the smoke test. Turn it off: Cloudflare → nauticalnomads.com → Security → Bots. The deploy has been rolled back."
            else
              echo "::error::Smoke test failed: /api/health, /en or /en/plan did not load. Rolling back."
            fi
            exit 1
          fi
          echo "production healthy"

      - name: Roll back if the smoke test failed
        if: failure() && steps.smoke.outcome == 'failure' && steps.prev.outputs.id != ''
        run: |
          npx wrangler rollback "${{ steps.prev.outputs.id }}" --message "Automatic rollback - smoke test failed" || true

      - name: Tag the release
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="prod-$(date -u +%Y%m%d-%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
